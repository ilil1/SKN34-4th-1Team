spring.application.name=govbiz-core-service

# 전환 모드: true이면 Core의 제공처 수집·색인·일회성 수집을 끄고 Catalog의 읽기 projection만 받는다.
# 기존 AWS/Compose는 명시적 데이터 이전 전까지 false를 유지한다. 토큰은 두 서버에만 주입한다.
app.catalog.projection.enabled=${CATALOG_PROJECTION_ENABLED:false}
app.catalog.base-url=${CATALOG_SERVICE_URL:http://catalog-service:8081}
app.catalog.internal-token=${CATALOG_INTERNAL_TOKEN:}
app.catalog.connect-timeout=${CATALOG_CONNECT_TIMEOUT:PT2S}
app.catalog.read-timeout=${CATALOG_READ_TIMEOUT:PT30S}
app.catalog.sources=${CATALOG_SOURCES:BIZINFO,KSTARTUP,MSIT,CNTRADE_NOTICE}
app.catalog.projection.initial-delay=${CATALOG_PROJECTION_INITIAL_DELAY:PT5S}
app.catalog.projection.fixed-delay=${CATALOG_PROJECTION_FIXED_DELAY:PT30S}

# 키워드 후보 검색 전용 Nori + BM25 색인. 공고 원본은 MySQL, 의미 검색은 Qdrant를 유지한다.
app.elasticsearch.base-url=${ELASTICSEARCH_BASE_URL:http://127.0.0.1:9200}
app.elasticsearch.index-name=${ELASTICSEARCH_INDEX_NAME:govbiz-support-program-lexical-v2}
app.elasticsearch.api-key=${ELASTICSEARCH_API_KEY:}
app.elasticsearch.connect-timeout=${ELASTICSEARCH_CONNECT_TIMEOUT:2s}
app.elasticsearch.read-timeout=${ELASTICSEARCH_READ_TIMEOUT:10s}

# 맞춤 리포트는 수신 주소 확인 + 명시적 동의 후 발송한다. 두 스위치 모두 기본은 꺼짐이다.
app.daily-report.enabled=${DAILY_REPORT_ENABLED:false}
app.daily-report.mail-enabled=${DAILY_REPORT_MAIL_ENABLED:false}
app.daily-report.frontend-base-url=${DAILY_REPORT_FRONTEND_BASE_URL:http://127.0.0.1:5173}
app.daily-report.from=${DAILY_REPORT_FROM:}
app.daily-report.send-hour=${DAILY_REPORT_SEND_HOUR:8}
app.daily-report.push.enabled=${DAILY_REPORT_PUSH_ENABLED:false}
app.daily-report.push.access-token=${DAILY_REPORT_PUSH_ACCESS_TOKEN:}
app.daily-report.max-accounts-per-run=${DAILY_REPORT_MAX_ACCOUNTS_PER_RUN:20}
app.daily-report.max-reports-per-day=${DAILY_REPORT_MAX_REPORTS_PER_DAY:20}
app.daily-report.max-programs=${DAILY_REPORT_MAX_PROGRAMS:3}
# 관심 공고 마감 알림 스케줄러. 기본은 꺼짐이다. 메일은 위 리포트 메일 설정, 앱 알림은 리포트 앱 푸시 설정을 함께 쓴다.
app.deadline-reminder.enabled=${DEADLINE_REMINDER_ENABLED:false}
app.deadline-reminder.send-hour=${DEADLINE_REMINDER_SEND_HOUR:9}
app.deadline-reminder.max-per-run=${DEADLINE_REMINDER_MAX_PER_RUN:50}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties[mail.smtp.ssl.enable]=${SMTP_SSL_ENABLED:false}
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=10000
spring.mail.properties[mail.smtp.writetimeout]=10000

# 지원사업 카탈로그를 저장하는 MySQL 연결이다. Compose에서는 mysql 서비스 주소로 덮어쓴다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/govbiz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:govbiz}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:govbiz-local}

# 로그인 전 검색 결과의 30분 복원용 저장소. 대화 기록 원본과 회원 세션은 MySQL을 유지한다.
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${REDIS_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false

# 정기 리포트 생성 전용 RabbitMQ. 수동 미리보기와 메일 전송 계약은 유지한다.
app.daily-report.queue.enabled=${DAILY_REPORT_QUEUE_ENABLED:false}
app.daily-report.queue.delivery-enabled=${DAILY_REPORT_DELIVERY_QUEUE_ENABLED:false}
app.combination-review.queue.enabled=${COMBINATION_REVIEW_QUEUE_ENABLED:false}
app.combination-review.unknown-ttl=${COMBINATION_REVIEW_UNKNOWN_TTL:PT30M}
app.application-form-discovery.queue.enabled=${APPLICATION_FORM_DISCOVERY_QUEUE_ENABLED:false}
app.application-form-discovery.unknown-ttl=${APPLICATION_FORM_DISCOVERY_UNKNOWN_TTL:PT30M}
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:govbiz}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:govbiz-rabbit-local}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:govbiz}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.requested-heartbeat=10s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# 관계형 SQL은 Kotlin 코드가 아니라 기능별 MyBatis Mapper XML(mybatis/{기능}/repository)에서 관리한다.
mybatis.mapper-locations=classpath:/mybatis/*/repository/*Mapper.xml

# 로컬 개발 기본값. 운영 환경에서는 APP_CORS_ALLOWED_ORIGIN 환경변수로 덮어쓴다.
app.cors.allowed-origin=http://localhost:5173

# 접속 주소를 클라이언트가 보낸 Forwarded 헤더로 바꾸지 않는다. 신뢰 프록시는 배포 시 별도 구성한다.
server.forward-headers-strategy=none

# 검색·근거 답변 공개 요청이 한 Core 프로세스에서 공유하는 최근 60초/동시 처리 한도다.
app.support-program-request.per-client-per-minute=${SUPPORT_PROGRAM_REQUEST_PER_CLIENT_PER_MINUTE:6}
app.support-program-request.global-per-minute=${SUPPORT_PROGRAM_REQUEST_GLOBAL_PER_MINUTE:60}
app.support-program-request.max-concurrent=${SUPPORT_PROGRAM_REQUEST_MAX_CONCURRENT:4}

# AI Service는 Core API만 호출하는 내부 서비스다. 운영 환경에서는 서버 환경변수로 덮어쓴다.
# 도우미 도구 에이전트. 비밀이 32자 미만이면 내부 도구 API가 닫히고, 에이전트를 켜려면 비밀이 있어야 합니다.
app.assistant.agent-enabled=${ASSISTANT_AGENT_ENABLED:false}
app.assistant.tools-secret=${ASSISTANT_TOOLS_TOKEN:}
app.assistant.tool-token-ttl=${ASSISTANT_TOOL_TOKEN_TTL:PT5M}
app.assistant.agent-per-client-per-minute=${ASSISTANT_AGENT_PER_CLIENT_PER_MINUTE:3}
app.assistant.document-prepare-timeout=${ASSISTANT_DOCUMENT_PREPARE_TIMEOUT:PT6S}
app.assistant.prefetch-queue-enabled=${ASSISTANT_PREFETCH_QUEUE_ENABLED:false}
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
app.ai-service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:1s}
app.ai-service.read-timeout=${AI_SERVICE_READ_TIMEOUT:35s}
app.ai-service.ranking-read-timeout=${AI_RANKING_READ_TIMEOUT:55s}
app.ai-service.combination-review-read-timeout=${AI_COMBINATION_REVIEW_READ_TIMEOUT:75s}
# 중복 검토 새 실행의 AI 계약(v2 여섯 단계 | v3 세 질문). 웹·모바일이 v3 결과를 보여 주므로 v3가 기본이고, v2는 되돌릴 때만 쓴다.
app.combination-review.contract-version=${COMBINATION_REVIEW_CONTRACT_VERSION:v3}
app.ai-service.semantic-search-read-timeout=${AI_SEMANTIC_SEARCH_READ_TIMEOUT:30s}
# OpenAI 조직 사용량·실제 비용(Usage·Costs API). 조직 관리자 키가 있을 때만 가져오며 프로젝트 키로는 가져올 수 없습니다.
app.ai-cost.openai-admin-key=${OPENAI_ADMIN_KEY:}
app.ai-cost.openai-project-id=${OPENAI_PROJECT_ID:}
app.ai-cost.sync-enabled=${AI_COST_SYNC_ENABLED:true}
app.ai-cost.krw-per-usd=${AI_COST_KRW_PER_USD:}

# 공공데이터포털의 기업마당 지원사업 공고 조회 API 인증키다.
app.bizinfo.base-url=${BIZINFO_API_BASE_URL:https://apis.data.go.kr}
app.bizinfo.service-key=${DATA_GO_KR_SERVICE_KEY:}
app.bizinfo.connect-timeout=${BIZINFO_API_CONNECT_TIMEOUT:2s}
app.bizinfo.read-timeout=${BIZINFO_API_READ_TIMEOUT:10s}

# K-Startup은 별도 승인된 서비스키로 수집한다. 전용 scope로 최초 색인 규모를 제한한다.
app.kstartup.base-url=${KSTARTUP_API_BASE_URL:https://apis.data.go.kr}
app.kstartup.api-key=${KSTARTUP_API_KEY:}
app.kstartup.connect-timeout=${KSTARTUP_API_CONNECT_TIMEOUT:2s}
app.kstartup.read-timeout=${KSTARTUP_API_READ_TIMEOUT:10s}
app.kstartup.scope=${KSTARTUP_SYNC_SCOPE:RECENT_YEAR}

# 승인받은 공공데이터 키를 공유하되, 제공처별로 별도 키를 덮어쓸 수 있다.
app.msit.base-url=${MSIT_API_BASE_URL:https://apis.data.go.kr}
app.msit.api-key=${MSIT_API_KEY:${DATA_GO_KR_SERVICE_KEY:}}
app.msit.connect-timeout=${MSIT_API_CONNECT_TIMEOUT:2s}
app.msit.read-timeout=${MSIT_API_READ_TIMEOUT:20s}
app.cntrade-notice.base-url=${CNTRADE_NOTICE_API_BASE_URL:https://apis.data.go.kr}
app.cntrade-notice.api-key=${CNTRADE_NOTICE_API_KEY:${DATA_GO_KR_SERVICE_KEY:}}
app.cntrade-notice.connect-timeout=${CNTRADE_NOTICE_API_CONNECT_TIMEOUT:2s}
app.cntrade-notice.read-timeout=${CNTRADE_NOTICE_API_READ_TIMEOUT:20s}

# 기업마당 공식 상세 HTML은 공고별 근거 답변 요청에서만 제한적으로 읽는다.
app.bizinfo.source-document.base-url=${BIZINFO_SOURCE_DOCUMENT_BASE_URL:https://www.bizinfo.go.kr}
app.bizinfo.source-document.connect-timeout=${BIZINFO_SOURCE_DOCUMENT_CONNECT_TIMEOUT:2s}
app.bizinfo.source-document.read-timeout=${BIZINFO_SOURCE_DOCUMENT_READ_TIMEOUT:10s}

# 기업 등록 시 사업자등록번호로 등록 여부·상호·사업자 상태를 확인하는 Bizno 조회 API다. 키가 비어 있으면 조회·등록 요청은 503을 반환한다.
app.bizno.endpoint-url=${BIZNO_URL:https://bizno.net/api/fapi}
app.bizno.api-key=${BIZNO_API_KEY:}
app.bizno.connect-timeout=${BIZNO_API_CONNECT_TIMEOUT:2s}
app.bizno.read-timeout=${BIZNO_API_READ_TIMEOUT:10s}

# "로그인 상태 유지"를 켠 세션 JWT의 절대 만료 기간이다. 만료 세션은 로그인 시 정리한다.
app.account.session-ttl=${ACCOUNT_SESSION_TTL:P30D}
# "로그인 상태 유지"를 끈 세션의 절대 만료 기간이다. 쿠키는 브라우저를 닫으면 사라지는 세션 쿠키로 내려준다.
app.account.session-short-ttl=${ACCOUNT_SESSION_SHORT_TTL:PT12H}
# 마지막 사용 뒤 이 기간이 지나면 절대 만료 전이라도 세션을 끝낸다.
app.account.session-idle-ttl=${ACCOUNT_SESSION_IDLE_TTL:P7D}
# 세션 JWT의 HS256 서명 비밀키(32자 이상)다. 코드에 기본값을 두지 않으며 ACCOUNT_JWT_SECRET이 없으면 기동하지 않는다.
app.account.jwt-secret=${ACCOUNT_JWT_SECRET:}
# 탈퇴 표식(식별자 HMAC) 키. 비어 있으면 세션 JWT 비밀값을 씁니다.
app.account.identity-hmac-key=${ACCOUNT_IDENTITY_HMAC_KEY:}
app.account.withdrawal-mark.purge-enabled=${ACCOUNT_WITHDRAWAL_MARK_PURGE_ENABLED:true}
# 세션 쿠키의 Secure 속성이다. HTTPS가 없는 로컬 개발에서만 false로 둔다.
app.account.cookie-secure=${ACCOUNT_COOKIE_SECURE:true}

# 개발용 자동 로그인이다. 켜면 POST /api/v1/auth/dev-login이 관리자(기본) 또는 role=USER 회원 시드 계정(없으면 생성)으로 세션을 발급한다.
app.account.dev-login.enabled=${ACCOUNT_DEV_LOGIN_ENABLED:false}
app.account.dev-login.email=${ACCOUNT_DEV_LOGIN_EMAIL:admin@govbiz.local}
app.account.dev-login.member-email=${ACCOUNT_DEV_LOGIN_MEMBER_EMAIL:member@govbiz.local}
app.account.dev-login.password=${ACCOUNT_DEV_LOGIN_PASSWORD:govbiz-admin1}

# 비밀번호 재설정 메일이다. SMTP는 spring.mail.*를 함께 쓰고, 메일이 꺼져 있으면 개발용 로그인이 켜진 환경에서만 링크를 로그로 남긴다.
app.account.password-reset.mail-enabled=${ACCOUNT_PASSWORD_RESET_MAIL_ENABLED:false}
app.account.password-reset.from=${ACCOUNT_PASSWORD_RESET_FROM:}
app.account.password-reset.code-ttl=${ACCOUNT_PASSWORD_RESET_CODE_TTL:PT10M}
app.account.password-reset.token-ttl=${ACCOUNT_PASSWORD_RESET_TOKEN_TTL:PT30M}
app.account.password-reset.resend-cooldown=${ACCOUNT_PASSWORD_RESET_RESEND_COOLDOWN:PT1M}
app.account.password-reset.max-requests-per-hour=${ACCOUNT_PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:3}
app.account.password-reset.max-attempts=${ACCOUNT_PASSWORD_RESET_MAX_ATTEMPTS:5}

# 회원가입 인증번호 메일이다. 발송 여부·발신 주소는 따로 주지 않으면 비밀번호 재설정 메일 설정을 그대로 물려받는다.
app.account.email-verification.mail-enabled=${ACCOUNT_EMAIL_VERIFICATION_MAIL_ENABLED:${ACCOUNT_PASSWORD_RESET_MAIL_ENABLED:false}}
app.account.email-verification.from=${ACCOUNT_EMAIL_VERIFICATION_FROM:${ACCOUNT_PASSWORD_RESET_FROM:}}
app.account.email-verification.code-ttl=${ACCOUNT_EMAIL_VERIFICATION_CODE_TTL:PT10M}
app.account.email-verification.pass-ttl=${ACCOUNT_EMAIL_VERIFICATION_PASS_TTL:PT30M}
app.account.email-verification.resend-cooldown=${ACCOUNT_EMAIL_VERIFICATION_RESEND_COOLDOWN:PT1M}
app.account.email-verification.send-window=${ACCOUNT_EMAIL_VERIFICATION_SEND_WINDOW:PT10M}
app.account.email-verification.max-sends-per-window=${ACCOUNT_EMAIL_VERIFICATION_MAX_SENDS_PER_WINDOW:3}
app.account.email-verification.max-attempts=${ACCOUNT_EMAIL_VERIFICATION_MAX_ATTEMPTS:5}

# 소셜 로그인(OAuth 2.0 + OpenID Connect)이다. 공급자별 클라이언트 ID·시크릿이 둘 다 있어야 그 공급자가 켜진다.
# Redirect URI는 callback-base-url + /api/v1/auth/oauth/{kakao|google}/callback이며 공급자 콘솔에 같은 값을 등록한다.
# callback-base-url은 브라우저가 /api에 닿는 origin(로컬은 Vite 5173)이라 로그인 상태·세션 쿠키가 그 호스트에 붙는다.
app.account.oauth.callback-base-url=${ACCOUNT_OAUTH_CALLBACK_BASE_URL:http://127.0.0.1:5173}
app.account.oauth.frontend-base-url=${ACCOUNT_OAUTH_FRONTEND_BASE_URL:http://127.0.0.1:5173}
# 쉼표로 나눈 정확한 앱 callback URI. 예: govbiz://oauth/complete. 비어 있으면 모바일 OAuth 시작 불가.
app.account.mobile-oauth.redirect-uris=${ACCOUNT_MOBILE_OAUTH_REDIRECT_URIS:}
app.account.oauth.connect-timeout=${ACCOUNT_OAUTH_CONNECT_TIMEOUT:2s}
app.account.oauth.read-timeout=${ACCOUNT_OAUTH_READ_TIMEOUT:10s}
app.account.oauth.google.client-id=${ACCOUNT_OAUTH_GOOGLE_CLIENT_ID:}
app.account.oauth.google.client-secret=${ACCOUNT_OAUTH_GOOGLE_CLIENT_SECRET:}
app.account.oauth.kakao.client-id=${ACCOUNT_OAUTH_KAKAO_CLIENT_ID:}
app.account.oauth.kakao.client-secret=${ACCOUNT_OAUTH_KAKAO_CLIENT_SECRET:}
app.account.oauth.kakao.admin-key=${ACCOUNT_OAUTH_KAKAO_ADMIN_KEY:}
app.account.oauth.unlink.enabled=${ACCOUNT_OAUTH_UNLINK_ENABLED:true}
app.account.oauth.unlink.queue-enabled=${ACCOUNT_OAUTH_UNLINK_QUEUE_ENABLED:false}

# 앱이 시작된 직후 및 이후 6시간마다 기업마당 공고를 MySQL에 동기화한다.
app.bizinfo.sync.enabled=${BIZINFO_SYNC_ENABLED:true}
app.bizinfo.sync.initial-delay=${BIZINFO_SYNC_INITIAL_DELAY:PT0S}
app.bizinfo.sync.fixed-delay=${BIZINFO_SYNC_FIXED_DELAY:PT6H}

# 최초 수집은 임베딩 비용을 확인한 뒤 명시적으로 켠다. 기존 제공처와 독립 실행한다.
app.kstartup.sync.enabled=${KSTARTUP_SYNC_ENABLED:false}
app.kstartup.sync.initial-delay=${KSTARTUP_SYNC_INITIAL_DELAY:PT0S}
app.kstartup.sync.fixed-delay=${KSTARTUP_SYNC_FIXED_DELAY:PT6H}

# 두 신규 수집기는 초기 임베딩 비용과 제공처 응답을 확인한 뒤 각각 활성화한다.
app.msit.sync.enabled=${MSIT_SYNC_ENABLED:false}
app.msit.sync.initial-delay=${MSIT_SYNC_INITIAL_DELAY:PT0S}
app.msit.sync.fixed-delay=${MSIT_SYNC_FIXED_DELAY:PT6H}
app.cntrade-notice.sync.enabled=${CNTRADE_NOTICE_SYNC_ENABLED:false}
app.cntrade-notice.sync.initial-delay=${CNTRADE_NOTICE_SYNC_INITIAL_DELAY:PT0S}
app.cntrade-notice.sync.fixed-delay=${CNTRADE_NOTICE_SYNC_FIXED_DELAY:PT6H}

# MySQL의 현재 공고 전체를 AI Service의 벡터 색인에 반영하고 실패 시 다음 실행에서 재시도한다.
app.support-program-index.enabled=${SUPPORT_PROGRAM_INDEX_ENABLED:true}
app.support-program-index.initial-delay=${SUPPORT_PROGRAM_INDEX_INITIAL_DELAY:PT0S}
app.support-program-index.fixed-delay=${SUPPORT_PROGRAM_INDEX_FIXED_DELAY:PT1M}

# System form analysis: enable only in the environment authorized to make discovery calls.
app.application-form-analysis.enabled=${APPLICATION_FORM_ANALYSIS_ENABLED:false}
app.ai-service.application-form-discovery-read-timeout=${APPLICATION_FORM_DISCOVERY_READ_TIMEOUT:270s}
app.ai-service.application-form-worker-lease=${APPLICATION_FORM_WORKER_LEASE:1800s}
# A document generation whose outcome could not be confirmed keeps its lock this long instead of forever.
app.application-document.unknown-outcome-lock-ttl=${APPLICATION_DOCUMENT_UNKNOWN_OUTCOME_LOCK_TTL:PT24H}
# 문서 생성 작업 실행기. 같은 프로세스에서 QUEUED 작업을 집어 실행하며 인스턴스마다 concurrency개까지 동시에 만든다.
app.application-document.jobs.enabled=${APPLICATION_DOCUMENT_JOBS_ENABLED:true}
app.application-document.jobs.concurrency=${APPLICATION_DOCUMENT_JOBS_CONCURRENCY:2}
