apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: govbiz-msa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/instance: ai-service
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: govbiz-msa
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  revisionHistoryLimit: 3
  minReadySeconds: 3
  progressDeadlineSeconds: 600
  selector: &id001
    matchLabels:
      app.kubernetes.io/name: ai-service
      app.kubernetes.io/instance: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/instance: ai-service
      annotations:
        govbiz.io/source-sha: 40e7f7d36f69c498f2b9b0dee921687f064e0414
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ai-service
        image: 448871779288.dkr.ecr.ap-southeast-2.amazonaws.com/govbiz-demo/ai-service@sha256:3911ced3babb7992d7140713c066586b076f2da5d57636ad91998970d4e35b58
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: ASSISTANT_TOOLS_BASE_URL
          value: http://core-service.govbiz-msa.svc.cluster.local:8080
        - name: LANGFUSE_BASE_URL
          value: http://langfuse-web.govbiz-observability.svc.cluster.local:3000
        - name: LANGFUSE_ENABLED
          value: 'true'
        - name: LANGFUSE_ENVIRONMENT
          value: development
        - name: OPENAI_BASE_URL
          value: http://disabled-openai.invalid/v1
        - name: QDRANT_URL
          value: http://qdrant.govbiz-msa.svc.cluster.local:6333
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-runtime
              key: OPENAI_API_KEY
        - name: DOCUMENT_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-runtime
              key: DOCUMENT_INTERNAL_TOKEN
        - name: ASSISTANT_TOOLS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-runtime
              key: ASSISTANT_TOOLS_TOKEN
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: ai-runtime
              key: LANGFUSE_PUBLIC_KEY
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ai-runtime
              key: LANGFUSE_SECRET_KEY
        resources:
          limits:
            cpu: '2'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /internal/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 90
        livenessProbe:
          httpGet:
            path: /internal/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /internal/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 5
          timeoutSeconds: 8
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      nodeSelector:
        govbiz.io/http-pool: shared
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: *id001
            namespaces:
            - govbiz-msa
            topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service
  namespace: govbiz-msa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 2
  maxReplicas: 3
  metrics:
  - type: ContainerResource
    containerResource:
      name: cpu
      container: ai-service
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
