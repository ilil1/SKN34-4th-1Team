apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: govbiz-msa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/instance: ai-service
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: govbiz-msa
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  minReadySeconds: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
      app.kubernetes.io/instance: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/instance: ai-service
      annotations:
        govbiz.io/source-sha: a5fb3b0be4cc9e52dc0e8f1240524b4da9d437f6
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ai-service
        image: 448871779288.dkr.ecr.ap-southeast-2.amazonaws.com/govbiz-demo/ai-service@sha256:d94f57eb74a42cddf1557a5e7e05774a1c1a5ac528aeec467adac8372f585196
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: ASSISTANT_TOOLS_BASE_URL
          value: http://core-service.govbiz-msa.svc.cluster.local:8080
        - name: LANGFUSE_BASE_URL
          value: http://langfuse-web.govbiz-observability.svc.cluster.local:3000
        - name: LANGFUSE_ENABLED
          value: 'true'
        - name: LANGFUSE_ENVIRONMENT
          value: development
        - name: OPENAI_BASE_URL
          value: http://disabled-openai.invalid/v1
        - name: QDRANT_URL
          value: http://qdrant.govbiz-msa.svc.cluster.local:6333
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-runtime
              key: OPENAI_API_KEY
        - name: DOCUMENT_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-runtime
              key: DOCUMENT_INTERNAL_TOKEN
        - name: ASSISTANT_TOOLS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-runtime
              key: ASSISTANT_TOOLS_TOKEN
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: ai-runtime
              key: LANGFUSE_PUBLIC_KEY
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ai-runtime
              key: LANGFUSE_SECRET_KEY
        resources:
          limits:
            cpu: '2'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /internal/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 90
        livenessProbe:
          httpGet:
            path: /internal/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /internal/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 5
          timeoutSeconds: 8
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      nodeSelector:
        govbiz.io/workload-pool: observability
