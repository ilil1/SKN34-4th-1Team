apiVersion: v1
kind: Service
metadata:
  name: ops-service
  namespace: govbiz-msa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ops-service
    app.kubernetes.io/instance: ops-service
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-service
  namespace: govbiz-msa
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  minReadySeconds: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-service
      app.kubernetes.io/instance: ops-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-service
        app.kubernetes.io/instance: ops-service
      annotations:
        govbiz.io/source-sha: 8c84d366e79cbe69af9bd5f1fda12eba7aca889b
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ops-service
        image: 448871779288.dkr.ecr.ap-southeast-2.amazonaws.com/govbiz-demo/ops-service@sha256:620e41aaeb7a32647f0c58240b8fea1d3855502b3ae07ee14e709212f06a9350
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: CORE_API_URL
          value: http://core-service.govbiz-msa.svc.cluster.local:8080
        - name: DB_HOST
          value: ops-mysql
        - name: DB_NAME
          value: govbiz_ops
        - name: DB_PORT
          value: '3306'
        - name: DB_USER
          value: govbiz_ops
        - name: DJANGO_ALLOWED_HOSTS
          value: localhost,127.0.0.1,ops-service,ops-service.govbiz-msa.svc.cluster.local
        - name: DJANGO_COOKIE_SECURE
          value: 'true'
        - name: DJANGO_CSRF_TRUSTED_ORIGINS
          value: https://govbiz.vercel.app
        - name: DJANGO_DEBUG
          value: 'false'
        - name: LLMOPS_ARTIFACT_URL
          value: http://ops-artifacts.govbiz-evaluation.svc.cluster.local:8010
        - name: LLMOPS_EVIDENCE_DIR
          value: /evaluation-data
        - name: LLMOPS_LIVE_ENABLED
          value: 'false'
        - name: LLMOPS_RAG_LIVE_ENABLED
          value: 'false'
        - name: LLMOPS_RESULTS_DIR
          value: /results
        - name: LLMOPS_SCHEDULES_ENABLED
          value: 'false'
        - name: OPS_WEB_URL
          value: https://govbiz.vercel.app
        - name: PREFECT_API_URL
          value: http://prefect.govbiz-evaluation.svc.cluster.local:4200/api
        - name: PREFECT_UI_URL
          value: http://localhost:14200
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ops-runtime
              key: DJANGO_SECRET_KEY
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ops-runtime
              key: DB_PASSWORD
        - name: LLMOPS_ARTIFACT_TOKEN
          valueFrom:
            secretKeyRef:
              name: ops-runtime
              key: LLMOPS_ARTIFACT_TOKEN
        - name: LLMOPS_BUDGET_TOKEN
          valueFrom:
            secretKeyRef:
              name: ops-runtime
              key: LLMOPS_BUDGET_TOKEN
        resources:
          limits:
            cpu: '1'
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 90
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 5
          timeoutSeconds: 8
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: ops-sync
        image: 448871779288.dkr.ecr.ap-southeast-2.amazonaws.com/govbiz-demo/ops-service@sha256:620e41aaeb7a32647f0c58240b8fea1d3855502b3ae07ee14e709212f06a9350
        imagePullPolicy: IfNotPresent
        command:
        - python
        - manage.py
        - sync_evaluations
        - --watch
        env:
        - name: CORE_API_URL
          value: http://core-service.govbiz-msa.svc.cluster.local:8080
        - name: DB_HOST
          value: ops-mysql
        - name: DB_NAME
          value: govbiz_ops
        - name: DB_PORT
          value: '3306'
        - name: DB_USER
          value: govbiz_ops
        - name: DJANGO_ALLOWED_HOSTS
          value: localhost,127.0.0.1,ops-service,ops-service.govbiz-msa.svc.cluster.local
        - name: DJANGO_COOKIE_SECURE
          value: 'true'
        - name: DJANGO_CSRF_TRUSTED_ORIGINS
          value: https://govbiz.vercel.app
        - name: DJANGO_DEBUG
          value: 'false'
        - name: LLMOPS_ARTIFACT_URL
          value: http://ops-artifacts.govbiz-evaluation.svc.cluster.local:8010
        - name: LLMOPS_EVIDENCE_DIR
          value: /evaluation-data
        - name: LLMOPS_LIVE_ENABLED
          value: 'false'
        - name: LLMOPS_RAG_LIVE_ENABLED
          value: 'false'
        - name: LLMOPS_RESULTS_DIR
          value: /results
        - name: LLMOPS_SCHEDULES_ENABLED
          value: 'false'
        - name: OPS_WEB_URL
          value: https://govbiz.vercel.app
        - name: PREFECT_API_URL
          value: http://prefect.govbiz-evaluation.svc.cluster.local:4200/api
        - name: PREFECT_UI_URL
          value: http://localhost:14200
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ops-runtime
              key: DJANGO_SECRET_KEY
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ops-runtime
              key: DB_PASSWORD
        - name: LLMOPS_ARTIFACT_TOKEN
          valueFrom:
            secretKeyRef:
              name: ops-runtime
              key: LLMOPS_ARTIFACT_TOKEN
        - name: LLMOPS_BUDGET_TOKEN
          valueFrom:
            secretKeyRef:
              name: ops-runtime
              key: LLMOPS_BUDGET_TOKEN
        resources:
          limits:
            cpu: '1'
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      nodeSelector:
        govbiz.io/workload-pool: application
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: ops-mysql
            namespaces:
            - govbiz-msa
            topologyKey: kubernetes.io/hostname
---
