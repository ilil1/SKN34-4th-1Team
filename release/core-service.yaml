apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: govbiz-msa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: core-service
    app.kubernetes.io/instance: core-service
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: govbiz-msa
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 3
  minReadySeconds: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: core-service
      app.kubernetes.io/instance: core-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-service
        app.kubernetes.io/instance: core-service
      annotations:
        govbiz.io/source-sha: 214abbb7a108d10e11cbc51eedc6a830dd641566
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: core-service
            app.kubernetes.io/instance: core-service
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: core-service
        image: 448871779288.dkr.ecr.ap-southeast-2.amazonaws.com/govbiz-demo/core-service@sha256:a8dfd836c963e86464552ae19d710fecc2b12e392f54cfbf4ce4b2588d4e4daf
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ACCOUNT_COOKIE_SECURE
          value: 'false'
        - name: ACCOUNT_DEV_LOGIN_ENABLED
          value: 'false'
        - name: ACCOUNT_OAUTH_CALLBACK_BASE_URL
          value: http://localhost:18173
        - name: ACCOUNT_OAUTH_FRONTEND_BASE_URL
          value: https://govbiz.vercel.app
        - name: ACCOUNT_OAUTH_UNLINK_QUEUE_ENABLED
          value: 'false'
        - name: ACCOUNT_PASSWORD_RESET_MAIL_ENABLED
          value: 'false'
        - name: AI_SERVICE_BASE_URL
          value: http://ai-service.govbiz-msa.svc.cluster.local:8000
        - name: APPLICATION_FORM_ANALYSIS_ENABLED
          value: 'false'
        - name: APPLICATION_FORM_DISCOVERY_QUEUE_ENABLED
          value: 'false'
        - name: APP_CORS_ALLOWED_ORIGIN
          value: http://localhost:18173
        - name: ASSISTANT_AGENT_ENABLED
          value: 'false'
        - name: ASSISTANT_PREFETCH_QUEUE_ENABLED
          value: 'false'
        - name: BIZINFO_SYNC_ENABLED
          value: 'false'
        - name: CATALOG_PROJECTION_ENABLED
          value: 'true'
        - name: CATALOG_PROJECTION_FIXED_DELAY
          value: PT30S
        - name: CATALOG_PROJECTION_INITIAL_DELAY
          value: PT5S
        - name: CATALOG_SERVICE_URL
          value: http://catalog-service.govbiz-msa.svc.cluster.local:8081
        - name: CNTRADE_NOTICE_SYNC_ENABLED
          value: 'false'
        - name: COMBINATION_REVIEW_QUEUE_ENABLED
          value: 'false'
        - name: DAILY_REPORT_DELIVERY_QUEUE_ENABLED
          value: 'false'
        - name: DAILY_REPORT_ENABLED
          value: 'false'
        - name: DAILY_REPORT_FRONTEND_BASE_URL
          value: https://govbiz.vercel.app
        - name: DAILY_REPORT_MAIL_ENABLED
          value: 'false'
        - name: DAILY_REPORT_QUEUE_ENABLED
          value: 'false'
        - name: ELASTICSEARCH_BASE_URL
          value: http://elasticsearch:9200
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=60 -XX:ActiveProcessorCount=2
        - name: KSTARTUP_SYNC_ENABLED
          value: 'false'
        - name: LANGFUSE_BASE_URL
          value: http://langfuse-web.govbiz-observability.svc.cluster.local:3000
        - name: LANGFUSE_ENABLED
          value: 'true'
        - name: LANGFUSE_ENVIRONMENT
          value: development
        - name: MSIT_SYNC_ENABLED
          value: 'false'
        - name: RABBITMQ_HOST
          value: rabbitmq.govbiz-msa.svc.cluster.local
        - name: RABBITMQ_PORT
          value: '5672'
        - name: RABBITMQ_USERNAME
          value: govbiz
        - name: RABBITMQ_VHOST
          value: govbiz
        - name: REDIS_HOST
          value: redis
        - name: SERVER_SHUTDOWN
          value: graceful
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://core-mysql:3306/govbiz_core
        - name: SPRING_DATASOURCE_USERNAME
          value: govbiz_core
        - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
          value: 270s
        - name: SUPPORT_PROGRAM_INDEX_ENABLED
          value: 'false'
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: core-runtime
              key: SPRING_DATASOURCE_PASSWORD
        - name: ACCOUNT_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: core-runtime
              key: ACCOUNT_JWT_SECRET
        - name: CATALOG_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: core-runtime
              key: CATALOG_INTERNAL_TOKEN
        - name: DOCUMENT_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: core-runtime
              key: DOCUMENT_INTERNAL_TOKEN
        - name: ASSISTANT_TOOLS_TOKEN
          valueFrom:
            secretKeyRef:
              name: core-runtime
              key: ASSISTANT_TOOLS_TOKEN
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: core-runtime
              key: LANGFUSE_PUBLIC_KEY
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: core-runtime
              key: LANGFUSE_SECRET_KEY
        resources:
          limits:
            cpu: '2'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 90
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 5
          timeoutSeconds: 8
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      nodeSelector:
        govbiz.io/http-pool: shared
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-service
  namespace: govbiz-msa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: ContainerResource
    containerResource:
      name: cpu
      container: core-service
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
