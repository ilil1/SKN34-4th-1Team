# compose.yaml과 함께 사용한다. 기존 업무 Ops DB와 분리된 로컬 평가 전용 구성.
services:
  ops-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: govbiz_ops_llmops
      MYSQL_USER: govbiz
      MYSQL_PASSWORD: ${OPS_DB_PASSWORD:?Run init_ops_env.py}
      MYSQL_ROOT_PASSWORD: ${OPS_DB_ROOT_PASSWORD:?Run init_ops_env.py}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: ["ops-mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u govbiz -D govbiz_ops_llmops -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

  ops-service: &ops-service
    build: ../../backend/ops-service
    init: true
    ports: ["127.0.0.1:18001:8000"]
    environment: &ops-environment
      DJANGO_SECRET_KEY: ${OPS_DJANGO_SECRET_KEY:?Run init_ops_env.py}
      DJANGO_DEBUG: "false"
      DJANGO_COOKIE_SECURE: "false" # loopback HTTP 개발 전용
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,ops-service
      CORE_API_URL: ${OPS_CORE_API_URL:-http://host.docker.internal:8080}
      DB_NAME: govbiz_ops_llmops
      DB_USER: govbiz
      DB_PASSWORD: ${OPS_DB_PASSWORD:?Run init_ops_env.py}
      DB_HOST: ops-mysql
      DB_PORT: "3306"
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_UI_URL: http://localhost:14200
      LLMOPS_RESULTS_DIR: /results
      LLMOPS_EVIDENCE_DIR: /evaluation-data
      LLMOPS_BUDGET_TOKEN: ${LLMOPS_BUDGET_TOKEN:-}
      LLMOPS_LIVE_ENABLED: ${LLMOPS_LIVE_ENABLED:-false}
      LLMOPS_RAG_LIVE_ENABLED: ${LLMOPS_RAG_LIVE_ENABLED:-false}
      LLMOPS_SCHEDULES_ENABLED: ${LLMOPS_SCHEDULES_ENABLED:-false}
      LLMOPS_LIVE_MODEL: ${LLMOPS_LIVE_MODEL:-gpt-6-luna}
      LLMOPS_ALLOWED_MODELS: ${LLMOPS_ALLOWED_MODELS:-gpt-6-luna,gpt-6-sol,gpt-5.6-luna}
      LANGFUSE_PROJECT_URL: http://localhost:13000/project/govbiz-evidence-development
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - ops-results:/results:ro
      - ../../evaluation/support-program-evidence:/evaluation-data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ops-mysql: {condition: service_healthy}
      ops-bootstrap: {condition: service_completed_successfully}

  # 최초의 빈 DB만 Git의 공유 검토 기록으로 초기화한다. 기존 이력은 그대로 둔다.
  ops-bootstrap:
    <<: *ops-service
    ports: []
    environment:
      <<: *ops-environment
      LLMOPS_LOCAL_SEED_ENABLED: "true"
    command: ["python", "manage.py", "bootstrap_local_reviews"]
    volumes:
      - ops-results:/results
      - ../../evaluation/support-program-evidence:/evaluation-data:ro
    depends_on:
      ops-mysql: {condition: service_healthy}

  ops-sync:
    <<: *ops-service
    ports: []
    command: ["python", "manage.py", "sync_evaluations", "--watch"]
    restart: unless-stopped
    depends_on:
      ops-mysql: {condition: service_healthy}
      prefect: {condition: service_healthy}
      ops-bootstrap: {condition: service_completed_successfully}

  evaluation-runner:
    build:
      context: ../..
      dockerfile: infrastructure/llmops/Dockerfile.runner
    init: true
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      LANGFUSE_ENABLED: "true"
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_ENVIRONMENT: development
      LLMOPS_RESULTS_DIR: /results
      LLMOPS_BUDGET_TOKEN: ${LLMOPS_BUDGET_TOKEN:-}
      LLMOPS_LIVE_ENABLED: ${LLMOPS_LIVE_ENABLED:-false}
      LLMOPS_RAG_LIVE_ENABLED: ${LLMOPS_RAG_LIVE_ENABLED:-false}
      LLMOPS_SCHEDULES_ENABLED: ${LLMOPS_SCHEDULES_ENABLED:-false}
      LLMOPS_LIVE_MODEL: ${LLMOPS_LIVE_MODEL:-gpt-6-luna}
      LLMOPS_ALLOWED_MODELS: ${LLMOPS_ALLOWED_MODELS:-gpt-6-luna,gpt-6-sol,gpt-5.6-luna}
      LLMOPS_OPS_API_URL: http://ops-service:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes: ["ops-results:/results"]
    depends_on:
      prefect: {condition: service_healthy}
      langfuse-web: {condition: service_healthy}
      langfuse-worker: {condition: service_healthy}
      ops-bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  ops-mysql-data:
  ops-results:
