{{- if eq .Values.serviceName "ops-service" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: ops-service-migrate
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-service-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ required "imagePullSecrets entry requires a name" .name | quote }}
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        fsGroup: {{ .Values.runAsGroup }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ops-migrate
          image: {{ include "govbiz.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, manage.py, migrate_deployment]
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "secretName is required for secretKeys" $.Values.secretName }}
                  key: {{ . }}
            {{- end }}
            {{- include "govbiz.opsTraceCredentials" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.temporaryStorage }}}
{{- end }}
