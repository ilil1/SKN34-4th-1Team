{{- $image := include "govbiz.image" . -}}
{{- if not (kindIs "bool" .Values.autoscaling.enabled) -}}
  {{- fail "autoscaling.enabled must be a boolean" -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.opsTraces.enabled) -}}
  {{- fail "opsTraces.enabled must be a boolean" -}}
{{- end -}}
{{- if .Values.opsTraces.enabled -}}
  {{- if ne .Values.serviceName "ops-service" -}}
    {{- fail "opsTraces is only supported by ops-service" -}}
  {{- end -}}
  {{- range $key := list "LANGFUSE_PUBLIC_KEY" "LANGFUSE_SECRET_KEY" -}}
    {{- if or (hasKey $.Values.env $key) (has $key $.Values.secretKeys) -}}
      {{- fail (printf "opsTraces provides %s through ops-langfuse; duplicate env/secretKeys are forbidden" $key) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if ne (int .Values.replicas) 1 -}}
  {{- fail "replicas must remain 1; use autoscaling for reviewed stateless services" -}}
{{- end -}}
{{- if .Values.autoscaling.enabled -}}
  {{- if not (has .Values.serviceName (list "core-service" "ai-service" "web")) -}}
    {{- fail "autoscaling is only supported by reviewed Core, AI or web HTTP services" -}}
  {{- end -}}
  {{- range $key := list "minReplicas" "maxReplicas" "targetCPUUtilizationPercentage" -}}
    {{- if not (regexMatch `^[1-9][0-9]*$` (toString (index $.Values.autoscaling $key))) -}}
      {{- fail (printf "autoscaling.%s must be a positive integer" $key) -}}
    {{- end -}}
  {{- end -}}
  {{- if or (gt (int .Values.autoscaling.minReplicas) (int .Values.autoscaling.maxReplicas)) (gt (int .Values.autoscaling.maxReplicas) 10) -}}
    {{- fail "autoscaling requires 1 <= minReplicas <= maxReplicas <= 10" -}}
  {{- end -}}
  {{- if gt (int .Values.autoscaling.targetCPUUtilizationPercentage) 100 -}}
    {{- fail "autoscaling.targetCPUUtilizationPercentage must be between 1 and 100" -}}
  {{- end -}}
  {{- $cpu := toString (dig "requests" "cpu" "" .Values.resources) -}}
  {{- if or (not (regexMatch `^([0-9]+([.][0-9]+)?|[.][0-9]+)m?$` $cpu)) (le (float64 (trimSuffix "m" $cpu)) 0.0) -}}
    {{- fail "autoscaling requires a positive resources.requests.cpu" -}}
  {{- end -}}
{{- end -}}
{{- if not (has .Values.serviceName (list "core-service" "catalog-service" "ai-service" "ops-service" "web")) -}}
  {{- fail "Unknown GovBiz serviceName" -}}
{{- end -}}
{{- range $key, $value := .Values.env -}}
  {{- if regexMatch "(?i)(PASSWORD|SECRET|TOKEN|API_KEY|SERVICE_KEY|PRIVATE_KEY)$" $key -}}
    {{- fail (printf "%s must be injected through secretKeys, not env" $key) -}}
  {{- end -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.opsSync.enabled) -}}
  {{- fail "opsSync.enabled must be a boolean" -}}
{{- end -}}
{{- if .Values.opsSync.enabled -}}
  {{- if ne .Values.serviceName "ops-service" -}}
    {{- fail "opsSync is only supported by ops-service" -}}
  {{- end -}}
  {{- range $key := list "PREFECT_API_URL" "LLMOPS_ARTIFACT_URL" -}}
    {{- $url := toString (default "" (index $.Values.env $key)) -}}
    {{- if not (regexMatch `^https?://[^/?#@[:space:]\\]+(/[^?#[:space:]\\]*)?$` $url) -}}
      {{- fail (printf "opsSync requires an HTTP(S) %s without credentials, query or fragment" $key) -}}
    {{- end -}}
    {{- $host := (urlParse $url).host -}}
    {{- if regexMatch `(?i)(\.invalid|^localhost|^127\.[0-9.]+|^\[::1\])(:[0-9]+)?$` $host -}}
      {{- fail (printf "opsSync requires a reachable remote %s, not a placeholder or loopback" $key) -}}
    {{- end -}}
  {{- end -}}
  {{- if or (ne .Values.secretName "ops-runtime") (not (has "LLMOPS_ARTIFACT_TOKEN" .Values.secretKeys)) -}}
    {{- fail "opsSync requires LLMOPS_ARTIFACT_TOKEN in ops-runtime secretKeys" -}}
  {{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceName }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.autoscaling.enabled }}
  # The HPA owns replicas; GitOps must not reset them on every release.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  {{- else }}
  replicas: 1
  # RollingUpdate can overlap writers even with replica=1. Accept brief downtime.
  strategy: {type: Recreate}
  {{- end }}
  revisionHistoryLimit: 3
  minReadySeconds: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.serviceName }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.serviceName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.autoscaling.enabled }}
      # Prefer spreading when another node exists, but allow one-node operation.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.serviceName }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ required "imagePullSecrets entry requires a name" .name | quote }}
        {{- end }}
      {{- end }}
      # Allow in-flight AI/Core requests to finish during scale-down.
      terminationGracePeriodSeconds: {{ ternary 300 60 .Values.autoscaling.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        fsGroup: {{ .Values.runAsGroup }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ .Values.serviceName }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.autoscaling.enabled }}
          lifecycle:
            preStop:
              sleep: {seconds: 10}
          {{- end }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          {{- if or .Values.env .Values.secretKeys .Values.opsTraces.enabled }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "secretName is required for secretKeys" $.Values.secretName }}
                  key: {{ . }}
            {{- end }}
            {{- include "govbiz.opsTraceCredentials" . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.readyPath }}
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      {{- if .Values.opsSync.enabled }}
        - name: ops-sync
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, manage.py, sync_evaluations, --watch]
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ . }}
            {{- end }}
            {{- include "govbiz.opsTraceCredentials" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.temporaryStorage }}}
