# One release/Application per service. No umbrella release or shared Secret.
serviceName: ""
localMode: false
image: {repository: "", digest: "", tag: "", pullPolicy: IfNotPresent}
# References only; create pull credentials outside Git/Helm in the same namespace.
imagePullSecrets: []
port: 8080
replicas: 1
# Opt in only for HTTP services whose background work is safe with multiple Pods.
# Metrics Server and a node autoscaler are installed separately by the cluster owner.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
env: {}
secretName: ""
secretKeys: []
# Opt in only after Prefect/artifact Service endpoints and their Secret are configured.
opsSync: {enabled: false}
# Dedicated trace credentials stay outside the Ops database/recovery Secret.
opsTraces: {enabled: false}
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}
runAsUser: 10001
runAsGroup: 10001
healthPath: /health
readyPath: /health
temporaryStorage: 256Mi
