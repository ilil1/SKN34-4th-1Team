{{- include "observability.validate" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: deny-all, namespace: {{ .Release.Namespace }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: langfuse-web-ingress, namespace: {{ .Release.Namespace }}}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: langfuse-web}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: govbiz-msa}
          podSelector:
            matchLabels: {app.kubernetes.io/name: api-gateway}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: govbiz-evaluation}
          podSelector:
            matchLabels: {app.kubernetes.io/name: evaluation-runner}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: govbiz-msa}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [core-service, ai-service, ops-service]}
      ports: [{protocol: TCP, port: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: langfuse-app-egress, namespace: {{ .Release.Namespace }}}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [langfuse-web, langfuse-worker]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range $name := list "postgres" "clickhouse" "redis" "minio" }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: {{ $name }}}
      ports:
        - {protocol: TCP, port: {{ index (dict "postgres" 5432 "clickhouse" 8123 "redis" 6379 "minio" 9000) $name }}}
        {{- if eq $name "clickhouse" }}
        - {protocol: TCP, port: 9000}
        {{- end }}
    {{- end }}
{{- range $name := list "postgres" "clickhouse" "redis" "minio" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $name }}-ingress, namespace: {{ $.Release.Namespace }}}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [langfuse-web, langfuse-worker]}
      ports:
        - {protocol: TCP, port: {{ index (dict "postgres" 5432 "clickhouse" 8123 "redis" 6379 "minio" 9000) $name }}}
        {{- if eq $name "clickhouse" }}
        - {protocol: TCP, port: 9000}
        {{- end }}
{{- end }}
