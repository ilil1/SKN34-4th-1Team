# Apply after the service's approved base values; supply its verified image separately.
localMode: false
image: {tag: "", digest: "", pullPolicy: IfNotPresent}
opsSync: {enabled: true}
opsTraces: {enabled: true}
env:
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,ops-service,ops-service.govbiz-msa.svc.cluster.local
  CORE_API_URL: http://core-service.govbiz-msa.svc.cluster.local:8080
  OPS_WEB_URL: http://localhost:18173
  PREFECT_API_URL: http://prefect.govbiz-evaluation.svc.cluster.local:4200/api
  PREFECT_UI_URL: http://localhost:14200
  LLMOPS_ARTIFACT_URL: http://ops-artifacts.govbiz-evaluation.svc.cluster.local:8010
  LANGFUSE_BASE_URL: http://langfuse-web.govbiz-observability.svc.cluster.local:3000
  LLMOPS_LIVE_ENABLED: "false"
  LLMOPS_RAG_LIVE_ENABLED: "false"
  LLMOPS_SCHEDULES_ENABLED: "false"
secretName: ops-runtime
# Helm replaces arrays: retain DB/auth keys as well as both internal tokens.
secretKeys: [DJANGO_SECRET_KEY, DB_PASSWORD, LLMOPS_ARTIFACT_TOKEN, LLMOPS_BUDGET_TOKEN]
