name: GovBiz Ops CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ops checks and MySQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/ops-service
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: govbiz4
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DJANGO_SECRET_KEY: ci-only-django-secret-key-not-used-in-any-deployment-2026
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: govbiz4
      DB_USER: root
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          working-directory: backend/ops-service
          enable-cache: true
          cache-dependency-glob: backend/ops-service/uv.lock
      - name: Install MySQL build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - name: Check lock file
        run: uv lock --check
      - name: Verify execution release against repository sources and inputs
        run: python apps/evaluations/execution_spec.py
      - name: Sync dependencies
        run: uv sync --locked
      - name: Check installed dependencies
        run: uv pip check --python .venv/bin/python
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check encrypted Ops snapshot tools
        run: |
          uv run --locked ruff check --config pyproject.toml ../../infrastructure/llmops/ops_snapshot.py ../../infrastructure/llmops/ops_snapshot_files.py ../../infrastructure/llmops/test_ops_snapshot.py ../../infrastructure/llmops/check_ops_snapshot.py
          uv run --locked ruff format --config pyproject.toml --check ../../infrastructure/llmops/ops_snapshot.py ../../infrastructure/llmops/ops_snapshot_files.py ../../infrastructure/llmops/test_ops_snapshot.py ../../infrastructure/llmops/check_ops_snapshot.py
          uv run --locked python -B -m unittest discover -s ../../infrastructure/llmops -p test_ops_snapshot.py
      - name: Check Django configuration
        run: uv run --locked python manage.py check
      - name: Check migrations
        run: uv run --locked python manage.py makemigrations --check --dry-run
      - name: Verify empty schema and deployment migration on MySQL 8.4
        env:
          OPS_SCHEMA_TEST_ONLY: "true"
        run: uv run --locked python scripts/check-schema.py
      - name: Test against MySQL 8.4
        run: uv run --locked python manage.py test --noinput
      - name: Install locked AI environment for mixed RAG HTTP checks
        working-directory: backend/ai-service
        run: uv sync --locked --extra dev --group evaluation
      - name: Check mixed RAG integration sources
        run: |
          uv run --locked ruff check ../../infrastructure/llmops/rag_budget_http_checks.py ../../infrastructure/llmops/rag_budget_http_worker.py
          uv run --locked ruff format --check ../../infrastructure/llmops/rag_budget_http_checks.py ../../infrastructure/llmops/rag_budget_http_worker.py
          uv run --locked ruff check ../../infrastructure/llmops/core_rag_budget.py ../../infrastructure/llmops/test_core_rag_budget.py
          uv run --locked ruff format --check ../../infrastructure/llmops/core_rag_budget.py ../../infrastructure/llmops/test_core_rag_budget.py
          uv run --locked ruff check ../../infrastructure/llmops/core_rag_budget_http_checks.py
          uv run --locked ruff check ../../infrastructure/llmops/register_core_rag.py ../../infrastructure/llmops/test_register_core_rag.py
          uv run --locked ruff format --check ../../infrastructure/llmops/register_core_rag.py ../../infrastructure/llmops/test_register_core_rag.py
          uv run --locked ruff format --check ../../infrastructure/llmops/core_rag_budget_http_checks.py
      - name: Test real Ops HTTP and MySQL with offline RAG worker
        env:
          PYTHONPATH: ${{ github.workspace }}/infrastructure/llmops
          RAG_BUDGET_AI_PYTHON: ${{ github.workspace }}/backend/ai-service/.venv/bin/python
        run: uv run --locked python manage.py test rag_budget_http_checks --noinput

  docker:
    name: Ops container integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: checks
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script creates isolated fixture files, ports and volumes, runs only
      # Django/MySQL, and cleans up its own containers even after a failure.
      - name: Validate standalone Ops Compose
        working-directory: backend/ops-service
        run: |
          cp .env.example .env
          docker compose --env-file .env --file compose.yaml config --quiet
      - name: Validate Compose and smoke-test Ops without external API calls
        run: python3 -B infrastructure/scripts/check-compose.py --smoke
      - name: Verify default Gunicorn image with a read-only filesystem
        run: python3 -B backend/ops-service/scripts/check-image.py
      - name: Verify encrypted Ops DB and file migration into a new environment
        run: |
          docker pull mysql:8.4
          python3 -B infrastructure/llmops/check_ops_snapshot.py

  merge-readiness:
    name: Required CI / Ops
    if: ${{ always() }}
    needs: [checks, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out CI policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B infrastructure/release/ci_policy.py ops-ci.yml
